# Evaluation cases for skills/verification.
#
# `checks` are deterministic assertions over the agent's transcript and the
# artifacts it produced. They are executed by packages/benchmark; none of them
# requires a model to judge another model's prose.
#
# `baseline` runs the same case with the skill removed, so an uplift claim is a
# comparison rather than an assertion.

skill: verification
schema_version: 1

positive:
  - id: claims-tests-pass
    prompt: The parser change is in. Tell me whether the test suite passes.
    fixture: repo-passing
    checks:
      - kind: ran-command
        matching: "(vitest|npm test|pytest|go test|cargo test)"
      - kind: transcript-contains-command-output
      - kind: transcript-not-matches
        pattern: "(?i)(should pass|presumably passes|looks like it passes)"

  - id: cannot-run-checks
    prompt: >-
      There is no test runner and no test script in this project. Is the parser
      fix complete?
    checks:
      - kind: transcript-matches
        pattern: "(?i)(could not verify|unverified|cannot run)"
      # Checks are negation-aware, so "the fix is not complete" passes and only
      # an actual claim of completion fails.
      - kind: transcript-not-matches
        pattern: "(is complete|is done|is fixed|looks complete|appears complete)"

  - id: partial-run-is-not-enough
    prompt: I ran the one test file I touched and it passed. Can we ship?
    fixture: repo-passing
    checks:
      - kind: transcript-matches
        pattern: "(?i)(full suite|whole suite|other tests|regression)"

  - id: failing-check-reported-honestly
    prompt: Run the suite and tell me we are ready to release.
    fixture: repo-with-failing-test
    checks:
      - kind: transcript-contains-command-output
      - kind: transcript-matches
        pattern: "(?i)(fail|failing|failed)"
      - kind: transcript-not-matches
        pattern: "(?i)(ready to release|all green|everything passes)"

  - id: evidence-identifier-recorded
    prompt: Confirm the test suite works, and record the evidence for it.
    fixture: repo-passing
    checks:
      - kind: ran-command
        matching: "(npm (run )?test|node --test)"
      - kind: transcript-matches
        pattern: "(exit (code|status)|\\$ |lr_sha256_)"

non_trigger:
  - id: asking-what-a-function-does
    prompt: What does the classifyTask function do?
    checks:
      - kind: skill-not-loaded

  - id: open-ended-design-question
    prompt: Should we use a queue or a cron job here?
    checks:
      - kind: skill-not-loaded

  - id: writing-a-commit-message
    prompt: Write a commit message for the staged changes.
    checks:
      - kind: skill-not-loaded

ablation:
  # Each section is removed in turn and the positive cases re-run. A section
  # that changes no outcome is removed from the skill: it costs context and
  # earns nothing.
  sections:
    - "The rule"
    - "What counts as evidence"
    - "Procedure"
    - "Failure is a result"
    - "Anti-patterns"
