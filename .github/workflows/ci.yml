name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect the tarball
        run: npm pack --workspace packages/cli --dry-run
      - name: Refuse to publish source maps, fixtures or telemetry data
        run: |
          contents="$(npm pack --workspace packages/cli --dry-run --json)"
          echo "$contents"
          for forbidden in ".map" "evals/" "telemetry.json" ".tsbuildinfo" ".env"; do
            if echo "$contents" | grep -q "$forbidden"; then
              echo "::error::tarball contains $forbidden"
              exit 1
            fi
          done

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails on any unexpected failure, and on a stale baseline entry that now
      # passes. The baseline is reviewed in conformance/expected-failures.yaml.
      - run: npm run conformance

  benchmark:
    name: benchmark release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the benchmark and evaluate the release gate
        run: node packages/cli/dist/bin.js benchmark --conformance-passed --json benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-result
          path: benchmark.json
